[build-system]
requires = ["maturin>=1.9.6,<2"]
build-backend = "maturin"

[project]
name = "starfix"
dynamic = ["version"]
description = "Deterministic logical hashing of Apache Arrow data (schemas, record batches, tables, arrays)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
keywords = ["arrow", "hashing"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["pyarrow>=14"]

[project.urls]
Repository = "https://github.com/nauticalab/starfix"

[tool.maturin]
bindings = "pyo3"
features = ["python", "pyo3/extension-module"]
python-source = "python"
module-name = "starfix._internal"
