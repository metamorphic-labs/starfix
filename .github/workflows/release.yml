# Publishes the crate `starfix` to crates.io and pushes the release tag v<version>, which
# triggers ci.yml and maturin-release.yml (the wheels). Only the maintainer runs it (RELEASING.md).
#
# This workflow never commits and never pushes a branch: the version bump and the CHANGELOG.md
# section reach `main` through an ordinary pull request first. It publishes the version that
# Cargo.toml on `main` already has, then tags that commit and pushes the tag only.
#
# Order: every check that can refuse runs before `cargo publish`; a publication on crates.io
# cannot be undone. The tag push is the only step after it. If that push fails, the crate is
# published but untagged, and the job's output says how to create the tag by hand.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in Cargo.toml on main (e.g. 0.6.0)'
        required: true
        type: string

# Every job gets a read-only GITHUB_TOKEN unless it asks for more.
permissions:
  contents: read

# Never two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The crates.io trusted publisher of `starfix` is registered for this repository, this
    # workflow and the environment `crates`; the OIDC token is accepted only from this job.
    environment: crates
    permissions:
      contents: read    # the tag is pushed with the App token, not with GITHUB_TOKEN
      id-token: write   # crates.io trusted publishing (OIDC, no stored API token)
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Refuse unless run on main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::release must be run on main (this run is on ${GITHUB_REF}). Nothing was published."
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a version such as 0.6.0. Nothing was published."
            exit 1
          fi

      # A GitHub App token, because a tag pushed with GITHUB_TOKEN would not trigger ci.yml and
      # maturin-release.yml (GitHub's recursion guard). The App needs Contents: write on this
      # repository. Generated before anything is published, so missing secrets refuse here.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The commit this run was dispatched on (the head of main at that time); the tag goes here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1
        with:
          toolchain: 1.91.1

      - name: Refuse unless Cargo.toml, CHANGELOG.md, the remote tags and crates.io agree
        run: |
          fail() { echo "::error::$1 Nothing was published."; exit 1; }

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "starfix") | .version')
          [ "${CARGO_VERSION}" = "${VERSION}" ] \
            || fail "Cargo.toml on main has version ${CARGO_VERSION}, not ${VERSION}: merge the version bump pull request first."

          # A heading "## <version>" or "## <version> (<date>)".
          VERSION_RE=$(printf '%s' "${VERSION}" | sed 's/[.]/\\./g')
          grep -Eq "^## \[?${VERSION_RE}\]?( |$)" CHANGELOG.md \
            || fail "CHANGELOG.md has no '## ${VERSION}' section."

          # Exit code 2: no such ref on the remote.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null
          STATUS=$?
          set -e
          [ "${STATUS}" -eq 2 ] || {
            [ "${STATUS}" -eq 0 ] && fail "The tag ${TAG} already exists on the remote."
            fail "Could not list the remote tags (git ls-remote exit code ${STATUS})."
          }

          # The crates.io sparse index lists every published version, yanked ones included.
          HTTP=$(curl -sS -o index.json -w '%{http_code}' https://index.crates.io/st/ar/starfix)
          case "${HTTP}" in
            200) if jq -e --arg v "${VERSION}" 'select(.vers == $v)' index.json > /dev/null; then
                   fail "starfix ${VERSION} is already on crates.io."
                 fi ;;
            404) ;;
            *) fail "Could not read the crates.io index (HTTP ${HTTP})." ;;
          esac
          rm -f index.json
          echo "OK: main at ${GITHUB_SHA} has version ${VERSION}, a CHANGELOG section, no tag ${TAG}, and ${VERSION} is not on crates.io."

      # The tag is created now, locally, so that a failure to create it refuses before publishing.
      # The dry-run push checks that the App token is accepted for a push to this repository; tag
      # rulesets, if any are added later, are evaluated only by the real push.
      - name: Create the tag locally and check that the App token may push
        run: |
          git config user.name "starfix release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "starfix ${VERSION}" "${GITHUB_SHA}"
          git push --dry-run origin "refs/tags/${TAG}" \
            || { echo "::error::The App token may not push to this repository. Nothing was published."; exit 1; }

      # Exchange the GitHub OIDC token for a short-lived crates.io token (trusted publishing,
      # https://crates.io/docs/trusted-publishing). The post step revokes it when the job ends.
      - name: Authenticate with crates.io (trusted publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # No --locked: Cargo.lock is not committed (a library), so there is none to hold to.
      - name: Publish to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish

      - name: Push the tag (the tag only)
        run: |
          if ! git push origin "refs/tags/${TAG}"; then
            {
              echo "## starfix ${VERSION} is on crates.io, but the tag ${TAG} was NOT pushed"
              echo
              echo "Nothing else is published until the tag exists (no wheels). Create it by hand on"
              echo "the published commit \`${GITHUB_SHA}\`, from a clone of the repository:"
              echo
              echo '```sh'
              echo "git fetch origin"
              echo "git tag -a ${TAG} -m \"starfix ${VERSION}\" ${GITHUB_SHA}"
              echo "git push origin ${TAG}"
              echo '```'
              echo
              echo "Do not run this workflow again for ${VERSION}: it refuses, as ${VERSION} is on crates.io."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "::error::crates.io has starfix ${VERSION} but the tag push failed: create ${TAG} on ${GITHUB_SHA} by hand (see the job summary)."
            exit 1
          fi
          echo "Pushed ${TAG} (${GITHUB_SHA}); it triggers ci.yml and maturin-release.yml."

      # cargo publish failed: it may have failed before or after the upload.
      - name: If the publication failed
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          {
            echo "## cargo publish failed for starfix ${VERSION}"
            echo
            echo "No tag was pushed. Check https://crates.io/crates/starfix/${VERSION}:"
            echo
            echo "- if ${VERSION} is NOT there, fix the cause and run this workflow again;"
            echo "- if ${VERSION} IS there, create the tag by hand on \`${GITHUB_SHA}\`:"
            echo "  \`git fetch origin && git tag -a ${TAG} -m \"starfix ${VERSION}\" ${GITHUB_SHA} && git push origin ${TAG}\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
