name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  python-binding:
    # Builds the Python binding (python/starfix) and runs its tests, including the differential
    # test against starfix-python, which needs its own environment (both import as "starfix").
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'
    - name: Build and install the binding
      run: |
        python -m venv .venv-binding
        .venv-binding/bin/pip install "maturin[patchelf]>=1.9.6,<2" "pyarrow>=22" pytest
        .venv-binding/bin/maturin build --out dist
        .venv-binding/bin/pip install --no-deps dist/*.whl
    - name: Install starfix-python for the differential test
      run: |
        PYARROW=$(.venv-binding/bin/python -c "import pyarrow; print(pyarrow.__version__)")
        python -m venv .venv-starfix-python
        .venv-starfix-python/bin/pip install "pyarrow==${PYARROW}"
        .venv-starfix-python/bin/pip install --no-deps --require-hashes -r python/tests/starfix-python-requirements.txt
    - name: Run the binding's tests
      env:
        STARFIX_PYTHON: ${{ github.workspace }}/.venv-starfix-python/bin/python
        STARFIX_REQUIRE_DIFFERENTIAL: '1'
      run: .venv-binding/bin/python -m pytest python/tests -ra

  verify-version-tag-sync:
    runs-on: ubuntu-latest
    # No job-level if: — always runs so downstream jobs are not skipped on workflow_dispatch.
    # The actual version check is gated to tag pushes at the step level.
    steps:
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag v${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "OK: Tag v${TAG} matches Cargo.toml version ${CARGO_VERSION}"
