name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  python-binding:
    # Builds the Python package (python/starfix, a PyO3 extension) and tests it: its own tests,
    # the differential test against starfix-python 0.5.0 (PyPI), and starfix-python's own test
    # suite at a pinned commit, run against this package (both import as "starfix", so
    # starfix-python runs in its own environment). The floor leg runs the package's tests on the
    # lowest supported Python and pyarrow.
    name: python-binding (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest pyarrow
            python: '3.13'
            pyarrow: ''
            parity: true
          - name: floor, Python 3.10, pyarrow 14
            python: '3.10'
            pyarrow: '14.0.2'
            parity: false
    env:
      # starfix-python's ITL-1177 branch (metamorphic-labs/starfix-python PR #13); move with it.
      STARFIX_PYTHON_COMMIT: 576d23bce7c2fa94216b7cabe095e2823a5c74fb
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      if: matrix.parity
      with:
        repository: metamorphic-labs/starfix-python
        ref: ${{ env.STARFIX_PYTHON_COMMIT }}
        path: starfix-python
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python }}
    - name: Build the wheel
      run: |
        python -m venv .venv-build
        .venv-build/bin/pip install "maturin>=1.9.6,<2"
        .venv-build/bin/maturin build --out dist
    - name: Install the wheel into a clean environment
      run: |
        python -m venv .venv-starfix
        .venv-starfix/bin/pip install dist/*.whl pytest
        if [ -n "${{ matrix.pyarrow }}" ]; then
          .venv-starfix/bin/pip install "pyarrow==${{ matrix.pyarrow }}" "numpy<2"
        fi
        .venv-starfix/bin/python -c "import pyarrow, starfix; print('starfix', starfix.__version__, starfix.__file__, 'pyarrow', pyarrow.__version__)"
    - name: Install starfix-python 0.5.0 for the differential test
      if: matrix.parity
      run: |
        PYARROW=$(.venv-starfix/bin/python -c "import pyarrow; print(pyarrow.__version__)")
        python -m venv .venv-starfix-python
        .venv-starfix-python/bin/pip install "pyarrow==${PYARROW}"
        .venv-starfix-python/bin/pip install --no-deps --require-hashes -r python/tests/starfix-python-requirements.txt
    - name: The package's tests
      env:
        STARFIX_PYTHON: ${{ matrix.parity && format('{0}/.venv-starfix-python/bin/python', github.workspace) || '' }}
        STARFIX_REQUIRE_DIFFERENTIAL: ${{ matrix.parity && '1' || '' }}
      run: .venv-starfix/bin/python -m pytest python/tests -ra
    - name: starfix-python's test suite against this package
      if: matrix.parity
      working-directory: starfix-python
      env:
        PYTHONPATH: ${{ github.workspace }}/python/tests/parity
      run: ../.venv-starfix/bin/python -m pytest -p starfix_python_private_stub tests -rs

  differential-harness:
    # The seeded differential harness against starfix-python 0.5.0 (python/tests/test_harness.py),
    # pull request tier: 2,000 seeds on each leg (newest pyarrow; Python 3.10 with pyarrow 19).
    # The release tier (50,000 seeds, sharded) runs nightly and before publishing.
    uses: ./.github/workflows/differential-harness.yml
    with:
      seeds: 50000  # TEMPORARY: the first full release-tier run (reverted by the next commit)
      shards: '[0, 1, 2, 3]'

  verify-version-tag-sync:
    runs-on: ubuntu-latest
    # No job-level if: — always runs so downstream jobs are not skipped on workflow_dispatch.
    # The actual version check is gated to tag pushes at the step level.
    steps:
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag v${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "OK: Tag v${TAG} matches Cargo.toml version ${CARGO_VERSION}"
