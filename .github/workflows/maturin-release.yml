# Python wheels of this crate (python/starfix, a PyO3 extension module; ITL-1178).
#
# This workflow builds the wheels and the sdist on every pull request and push, and tests one
# wheel per operating system in a clean environment, so a broken wheel fails CI. Only a push of a
# release tag v* publishes: first to TestPyPI, then to PyPI. That tag is pushed by release.yml,
# which only the maintainer runs (RELEASING.md). Publishing uses trusted publishing (OIDC), with no
# stored token. The publishers of the project "starfix" on TestPyPI and PyPI are registered for
# owner metamorphic-labs, repository starfix, this workflow (maturin-release.yml) and the
# environments testpypi and pypi.
#
# One wheel per platform covers every Python >= 3.10: the extension is built against the stable
# ABI (abi3-py310, see Cargo.toml and pyproject.toml).
name: wheels

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # maturin is installed from PyPI and run directly: this repository allows only GitHub-owned
  # actions, verified creators and a short list of others, which PyO3/maturin-action is not on.
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig links against an old glibc / musl, so the wheels run on manylinux_2_17 / musllinux_1_2.
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, compatibility: manylinux2014, test: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, compatibility: manylinux2014, test: true }
          # pyarrow publishes no musllinux wheels, so these cannot be tested here (and need a
          # pyarrow built from source where they are used).
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, compatibility: musllinux_1_2, test: false }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, compatibility: musllinux_1_2, test: false }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: |
          rustup target add ${{ matrix.target }}
          python -m venv .venv-build
          # maturin finds zig (the ziglang package) through the active Python.
          source .venv-build/bin/activate
          pip install "maturin[zig]>=1.9.6,<2"
          maturin build --release --out dist --zig \
            --target ${{ matrix.target }} --compatibility ${{ matrix.compatibility }}
      - name: Test the wheel in a clean environment
        if: matrix.test
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install dist/*.whl pytest
          .venv-test/bin/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  macos:
    name: macos universal2
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      # One universal2 wheel (arm64 and x86_64); it is tested on this arm64 runner.
      - name: Build the wheel
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin>=1.9.6,<2"
          .venv-build/bin/maturin build --release --out dist --target universal2-apple-darwin
      - name: Test the wheel in a clean environment
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install dist/*.whl pytest
          .venv-test/bin/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-macos-universal2
          path: dist

  windows:
    name: windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the wheel
        shell: bash
        run: |
          python -m venv .venv-build
          .venv-build/Scripts/python -m pip install "maturin>=1.9.6,<2"
          .venv-build/Scripts/maturin build --release --out dist
      - name: Test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .venv-test
          .venv-test/Scripts/python -m pip install "$(ls dist/*.whl)" pytest
          .venv-test/Scripts/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Build the sdist
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin>=1.9.6,<2"
          .venv-build/bin/maturin sdist --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-sdist
          path: dist

  # The tag must name the version the wheels were built with (maturin takes it from Cargo.toml).
  verify-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Cargo.toml version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

  publish-testpypi:
    name: publish to TestPyPI
    needs: [verify-tag, linux, macos, windows, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/starfix
    permissions:
      contents: read
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    name: publish to PyPI
    needs: [publish-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/starfix
    permissions:
      contents: read
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
