# Python wheels of this crate (python/starfix, a PyO3 extension module; ITL-1178).
#
# BUILD ONLY. This workflow builds the wheels and the sdist on every pull request and push, and
# tests one wheel per operating system in a clean environment, so a broken wheel fails CI. It
# publishes nothing: there is no publish job, token or trusted publisher here. Publishing to PyPI
# is the developer's decision; what it needs is described at the end of this file.
#
# One wheel per platform covers every Python >= 3.10: the extension is built against the stable
# ABI (abi3-py310, see Cargo.toml and pyproject.toml).
name: wheels

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # maturin is installed from PyPI and run directly: this repository allows only GitHub-owned
  # actions, verified creators and a short list of others, which PyO3/maturin-action is not on.
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig links against an old glibc / musl, so the wheels run on manylinux_2_17 / musllinux_1_2.
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, compatibility: manylinux2014, test: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, compatibility: manylinux2014, test: true }
          # pyarrow publishes no musllinux wheels, so these cannot be tested here (and need a
          # pyarrow built from source where they are used).
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, compatibility: musllinux_1_2, test: false }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, compatibility: musllinux_1_2, test: false }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: |
          rustup target add ${{ matrix.target }}
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin[zig]>=1.9.6,<2"
          .venv-build/bin/maturin build --release --out dist --zig \
            --target ${{ matrix.target }} --compatibility ${{ matrix.compatibility }}
      - name: Test the wheel in a clean environment
        if: matrix.test
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install dist/*.whl pytest
          .venv-test/bin/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  macos:
    name: macos universal2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      # One universal2 wheel (arm64 and x86_64); it is tested on this arm64 runner.
      - name: Build the wheel
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin>=1.9.6,<2"
          .venv-build/bin/maturin build --release --out dist --target universal2-apple-darwin
      - name: Test the wheel in a clean environment
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install dist/*.whl pytest
          .venv-test/bin/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-macos-universal2
          path: dist

  windows:
    name: windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the wheel
        shell: bash
        run: |
          python -m venv .venv-build
          .venv-build/Scripts/python -m pip install "maturin>=1.9.6,<2"
          .venv-build/Scripts/maturin build --release --out dist
      - name: Test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .venv-test
          .venv-test/Scripts/python -m pip install "$(ls dist/*.whl)" pytest
          .venv-test/Scripts/python -m pytest python/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Build the sdist
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin>=1.9.6,<2"
          .venv-build/bin/maturin sdist --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheels-sdist
          path: dist

# Publishing (not enabled; for the developer to decide and set up):
#
# The PyPI project "starfix" is currently published from nauticalab/starfix-python. To publish
# these wheels instead, a PyPI owner of "starfix" adds a trusted publisher for this repository
# (owner nauticalab, repository starfix, workflow maturin-release.yml, and a GitHub environment
# such as "pypi"), and the developer adds a job here, run only for tags, that downloads the
# artifacts above (actions/download-artifact) and uploads them with
# pypa/gh-action-pypi-publish under `permissions: id-token: write` in that environment. The
# trusted publisher of the other repository should then be removed. Version: maturin takes it
# from Cargo.toml, which cargo-release bumps at release.
