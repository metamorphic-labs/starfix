# The seeded differential harness (python/tests/test_harness.py; ITL-1178): the Python package
# built from this crate against a reference starfix-python from PyPI (hash-pinned; 0.5.0 by
# default, the version is an input), on seeded tables
# built in each process (_harness.py). Every call must give the same digest on both sides, or
# raise on both sides in the same class; a crash always fails.
#
# Tiers: ci.yml calls it on every pull request and push with 2,000 seeds (one shard per leg);
# the release tier is 50,000 seeds in 4 shards per leg, nightly and on demand, and the publish
# jobs need it before a release. Legs: the newest pyarrow, and the oldest Python and pyarrow
# that starfix-python 0.5.0 supports (Python 3.10, pyarrow 19).
name: differential-harness

on:
  workflow_call:
    inputs:
      seeds:
        description: Number of seeds, split evenly over the shards
        type: number
        required: true
      shards:
        description: 'The shards to run, as a JSON list (for example "[0, 1, 2, 3]")'
        type: string
        required: true
      reference:
        description: The starfix-python version to compare with (its differences are recorded per version)
        type: string
        default: '0.5.0'
      reference_requirements:
        description: The hash-pinned requirements file that installs that version
        type: string
        default: python/tests/starfix-python-requirements.txt
  workflow_dispatch:
    inputs:
      seeds:
        description: Number of seeds, split evenly over the shards
        type: number
        default: 50000
      shards:
        description: 'The shards to run, as a JSON list'
        type: string
        default: '[0, 1, 2, 3]'
      reference:
        description: The starfix-python version to compare with
        type: string
        default: '0.5.0'
      reference_requirements:
        description: The hash-pinned requirements file that installs that version
        type: string
        default: python/tests/starfix-python-requirements.txt
  schedule:
    - cron: '23 5 * * *'  # nightly: the release tier

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: 'Build the wheel (abi3, one wheel for every leg)'
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install "maturin>=1.9.6,<2"
          .venv-build/bin/maturin build --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: harness-wheel
          path: dist

  harness:
    name: harness (${{ matrix.leg.name }}, shard ${{ matrix.shard }})
    needs: [wheel]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[0, 1, 2, 3]') }}
        leg:
          - { name: 'newest pyarrow', python: '3.13', pyarrow: '' }
          - { name: 'floor, Python 3.10, pyarrow 19', python: '3.10', pyarrow: '19.0.1' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.leg.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: harness-wheel
          path: dist
      - name: Install the wheel, and the reference starfix-python with the same pyarrow in its own environment
        run: |
          python -m venv .venv-starfix
          .venv-starfix/bin/pip install dist/*.whl pytest
          if [ -n "${{ matrix.leg.pyarrow }}" ]; then
            .venv-starfix/bin/pip install "pyarrow==${{ matrix.leg.pyarrow }}"
          fi
          PYARROW=$(.venv-starfix/bin/python -c "import pyarrow; print(pyarrow.__version__)")
          python -m venv .venv-starfix-python
          .venv-starfix-python/bin/pip install "pyarrow==${PYARROW}"
          .venv-starfix-python/bin/pip install --no-deps --require-hashes -r "${{ inputs.reference_requirements || 'python/tests/starfix-python-requirements.txt' }}"
      - name: The harness, this shard's seeds
        env:
          STARFIX_PYTHON: ${{ github.workspace }}/.venv-starfix-python/bin/python
          STARFIX_REQUIRE_DIFFERENTIAL: '1'
          STARFIX_REFERENCE_VERSION: ${{ inputs.reference || '0.5.0' }}
          SEEDS: ${{ inputs.seeds || 50000 }}
          SHARDS: ${{ inputs.shards || '[0, 1, 2, 3]' }}
          SHARD: ${{ matrix.shard }}
        run: |
          COUNT=$(python -c "import json, os; print(int(os.environ['SEEDS']) // len(json.loads(os.environ['SHARDS'])))")
          export STARFIX_HARNESS_SEEDS="$(( SHARD * COUNT )):${COUNT}"
          echo "seeds ${STARFIX_HARNESS_SEEDS}"
          .venv-starfix/bin/python -m pytest python/tests/test_harness.py -ra -s
